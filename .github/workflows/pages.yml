name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify project
        run: |
          npm ci --ignore-scripts
          npm test
          npm run i18n:check
          npm run audio:check
          npm run islands:audio:check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare reviewed site files
        shell: bash
        run: |
          mkdir _site
          git archive HEAD | tar -xf - -C _site
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
